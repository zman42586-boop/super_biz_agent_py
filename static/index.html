<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能 OnCall 助手</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
</head>
<body>
    <main class="main-content" style="margin-left: 0;">
        <div class="chat-container centered" id="diagnosisContainer">
            <div class="welcome-greeting" id="welcomeGreeting">
                <p>MATLAB AIOps 自动诊断</p>
            </div>
            <div class="chat-messages" id="diagnosisOutput"></div>
            <div class="chat-input-container">
                <button class="ai-ops-top-btn" id="startDiagnosisBtn" type="button">
                    <span>开始诊断</span>
                </button>
                <a href="/docs" style="margin-left: 16px;">打开 API 文档</a>
            </div>
        </div>
    </main>
    <script src="/static/app.js"></script>
</body>
</html>
